<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All the Academies</title>

  <!-- MapLibre GL JS 지도 스타일 -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

  <style>
    :root {
      --ink: #17212b;
      --muted: #667085;
      --line: #e5e9ef;
      --surface: #ffffff;
      --accent: #246bfd;
      --accent-soft: #edf3ff;
      --shadow: 0 8px 28px rgba(20, 35, 55, .13);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans KR", sans-serif;
      color: var(--ink);
      overflow: hidden;
      background: #f4f6f8;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #eaf0e8;
    }

    .search-panel {
      position: fixed;
      z-index: 1000;
      top: 18px;
      left: 18px;
      width: min(360px, calc(100vw - 36px));
      padding: 14px;
      border: 1px solid rgba(229, 233, 239, .95);
      border-radius: 16px;
      background: rgba(255, 255, 255, .97);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 11px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 9px;
      color: white;
      background: var(--accent);
      font-size: 15px;
    }

    .area-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input {
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      background: #f8fafc;
      color: var(--ink);
      font-size: 14px;
    }

    .search-row input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(36, 107, 253, .12);
      background: white;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .search-button {
      flex: 0 0 auto;
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    .filters {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #475467;
      background: white;
      font-size: 12px;
    }

    .filter.active {
      border-color: #c9d8ff;
      color: var(--accent);
      background: var(--accent-soft);
      font-weight: 750;
    }

    .map-note {
      position: fixed;
      z-index: 500;
      right: 14px;
      bottom: 14px;
      max-width: min(350px, calc(100vw - 28px));
      padding: 9px 12px;
      border: 1px solid rgba(229, 233, 239, .9);
      border-radius: 10px;
      color: #475467;
      background: rgba(255,255,255,.94);
      box-shadow: 0 3px 14px rgba(20,35,55,.08);
      font-size: 11px;
      line-height: 1.5;
    }

    .map-note a { color: var(--accent); }

    .place-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 12px;
      height: 12px;
      padding: 0;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: #2878ff;
      box-shadow: 0 1px 5px rgba(0,0,0,.35);
      cursor: pointer;
      font-size: 0;
      border: 1px solid rgba(20,35,55,.08);
      border-radius: 11px;
      background: white;
      box-shadow: 0 3px 12px rgba(20,35,55,.17);
      color: var(--ink);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .place-pin .pin-star {
      color: #e5a000;
      font-size: 12px;
    }

    .place-pin .pin-score {
      color: #667085;
      font-size: 11px;
      font-weight: 650;
    }

    .maplibregl-popup-content {
      border-radius: 14px;
    }

    .maplibregl-popup-content {
      margin: 13px 15px;
      min-width: 175px;
    }

    .popup-category {
      color: var(--muted);
      font-size: 11px;
    }

    .popup-name {
      margin: 4px 0 7px;
      font-size: 15px;
      font-weight: 800;
    }

    .popup-rating {
      font-size: 13px;
      font-weight: 750;
    }

    .popup-rating span {
      color: #e5a000;
    }

    .popup-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .popup-action {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: var(--accent);
      font-size: 12px;
      font-weight: 750;
    }

    .empty-message {
      display: none;
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 9px;
      color: #667085;
      background: #f8fafc;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      .search-panel {
        top: 10px;
        left: 10px;
        width: calc(100vw - 20px);
        padding: 11px;
      }

      .brand-row { margin-bottom: 8px; }
      .map-note { font-size: 10px; }
    }
  </style>

<style>
#academy-panel {
  position: absolute; z-index: 5; top: 12px; left: 12px;
  width: min(360px, calc(100vw - 24px)); max-height: 82vh;
  display: flex; flex-direction: column; background: white;
  border-radius: 14px; box-shadow: 0 3px 18px #0002;
  font: 14px/1.5 Arial, sans-serif; color: #202b3c;
}
#academy-panel * { box-sizing: border-box; }
#academy-panel header { padding: 16px 16px 8px; }
#academy-panel h2 { margin: 0 0 4px; font-size: 20px; }
#academy-panel .muted { color: #697586; font-size: 12px; }
#academy-search { margin: 8px 16px; padding: 11px; border: 1px solid #ccd3dd;
  border-radius: 8px; font-size: 15px; }
#academy-results { overflow-y: auto; flex: 1 1 auto; min-height: 80px; }
.academy-row { display: block; width: 100%; text-align: left; padding: 12px 16px;
  border: 0; border-top: 1px solid #edf0f4; background: white; cursor: pointer; }
.academy-row:hover, .academy-row:focus { background: #edf4ff; }
.academy-row strong { display: block; font-size: 14px; }
.academy-row small { display: block; margin-top: 3px; color: #697586; }
#academy-detail { display: none; flex: 0 0 auto; min-height: 100px; padding: 14px 16px; border-top: 1px solid #dfe4eb;
  overflow-y: auto; max-height: 36vh; }
#academy-detail h3 { margin: 0 0 8px; font-size: 18px; }
#academy-detail p { margin: 6px 0; overflow-wrap: anywhere; }
#academy-close { float: right; border: 0; background: #edf0f4; border-radius: 6px;
  padding: 5px 9px; cursor: pointer; }
@media(max-width:600px) {
  #academy-panel { top: 8px; left: 8px; width: min(330px, calc(100vw - 16px));
    max-height: 76vh; }
}
</style>

ry":"학교","lat":35.826163,"lng":127.124305,"rating":null,"reviews":0,"source":"OpenStreetMap"},{"id":267,"name":"해뜰어린이집","category":"학교","lat":35.8357317,"lng":127.1181303,"rating":null,"reviews":0,"source":"OpenStreetMap"},{"id":268,"name":"혜화유치원","category":"학교","lat":35.8364803,"lng":127.1112109,"rating":null,"reviews":0,"source":"OpenStreetMap"},{"id":269,"name":"원영어학원","category":"학원","lat":35.8349145,"lng":127.1119725,"rating":null,"reviews":0,"source":"OpenStreetMap"}];

    let activeCategory = "전체";
    let activeQuery = "";
    let visiblePlaces = [];
    let selectedPlaceId = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function popupContent(place) {
      return `
        <div class="popup-category">${escapeHtml(place.category)}</div>
        <div class="popup-name">${escapeHtml(place.name)}</div>
        <div class="popup-rating">아직 평가 없음</div>
        <div class="popup-meta">OpenStreetMap 등록 정보 · 리뷰 데이터 없음</div>
        <button class="popup-action" onclick="showPlaceholder(${place.id})">
          리뷰 기능 준비 중
        </button>`;
    }

    function showPlaceholder(id) {
      const place = places.find(item => item.id === id);
      if (!place) return;
      alert(`${place.name}\n\n리뷰 작성 및 조회 기능은 아직 준비 중이야.`);
    }
    window.showPlaceholder = showPlaceholder;

    function filteredPlaces() {
      return places.filter(place => {
        const matchesCategory =
          activeCategory === "전체" || place.category === activeCategory;
        const matchesQuery =
          place.name.toLowerCase().includes(activeQuery.toLowerCase());
        return matchesCategory && matchesQuery;
      });
    }

    function popupFor(place) {
      return new maplibregl.Popup({ offset: 12, closeButton: true })
        .setHTML(popupContent(place));
    }

    function showPlacePopup(id) {
      const place = visiblePlaces.find(item => item.id === id);
      if (!place) return;
      new maplibregl.Popup({ offset: 12, closeButton: true })
        .setLngLat([place.lng, place.lat])
        .setHTML(popupContent(place))
        .addTo(map);
    }

    function updatePlaces() {
      visiblePlaces = filteredPlaces();

      const features = visiblePlaces.map(place => ({
        type: "Feature",
        properties: {
          id: place.id,
          name: place.name,
          category: place.category
        },
        geometry: {
          type: "Point",
          coordinates: [place.lng, place.lat]
        }
      }));

      const source = map.getSource("places");
      if (source) {
        source.setData({ type: "FeatureCollection", features });
      }

      document.getElementById("emptyMessage").style.display =
        visiblePlaces.length ? "none" : "block";

      return visiblePlaces;
    }

    function resetMapView() {
      map.flyTo({ center: [127.1178, 35.8318], zoom: 15 });
    }

    function applySearch() {
      activeQuery = document.getElementById("searchInput").value.trim();
      const results = updatePlaces();

      if (results.length === 1) {
        map.flyTo({
          center: [results[0].lng, results[0].lat],
          zoom: 17
        });
        map.once("moveend", () => showPlacePopup(results[0].id));
      } else if (results.length > 1) {
        const bounds = new maplibregl.LngLatBounds();
        results.forEach(place => bounds.extend([place.lng, place.lat]));
        map.fitBounds(bounds, { padding: 80, maxZoom: 16 });
      } else {
        resetMapView();
      }
    }

    function installPlaceLayers() {
      map.addSource("places", {
        type: "geojson",
        data: { type: "FeatureCollection", features: [] },
        cluster: true,
        clusterMaxZoom: 16,
        clusterRadius: 50
      });

      map.addLayer({
        id: "place-clusters",
        type: "circle",
        source: "places",
        filter: ["has", "point_count"],
        paint: {
          "circle-color": [
            "step", ["get", "point_count"],
            "#5B8DEF", 10, "#3769C8", 30, "#234A94"
          ],
          "circle-radius": [
            "step", ["get", "point_count"],
            14, 10, 18, 30, 22
          ],
          "circle-stroke-width": 2,
          "circle-stroke-color": "#FFFFFF"
        }
      });

      map.addLayer({
        id: "place-cluster-count",
        type: "symbol",
        source: "places",
        filter: ["has", "point_count"],
        layout: {
          "text-field": ["get", "point_count_abbreviated"],
          "text-font": ["Open Sans Bold", "Arial Unicode MS Bold"],
          "text-size": 13
        },
        paint: { "text-color": "#FFFFFF" }
      });

      map.addLayer({
        id: "place-points",
        type: "circle",
        source: "places",
        filter: ["!", ["has", "point_count"]],
        paint: {
          "circle-radius": 3,
          "circle-color": "#E05A47",
          "circle-stroke-width": 1,
          "circle-stroke-color": "#FFFFFF"
        }
      });

      map.addLayer({
        id: "place-names",
        type: "symbol",
        source: "places",
        filter: ["!", ["has", "point_count"]],
        minzoom: 15,
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Open Sans Regular", "Arial Unicode MS Regular"],
          "text-size": [
            "interpolate", ["linear"], ["zoom"],
            15, 9,
            17, 11,
            19, 12
          ],
          "text-offset": [0, 1.1],
          "text-anchor": "top",
          "text-max-width": 9,
          "text-padding": 3,
          "symbol-sort-key": ["get", "id"],
          "text-allow-overlap": false,
          "text-ignore-placement": false
        },
        paint: {
          "text-color": "#263445",
          "text-halo-color": "#FFFFFF",
          "text-halo-width": 1.2
        }
      });

      map.on("click", "place-clusters", event => {
        const feature = map.queryRenderedFeatures(event.point, {
          layers: ["place-clusters"]
        })[0];
        if (!feature) return;

        const clusterId = feature.properties.cluster_id;
        map.getSource("places").getClusterExpansionZoom(clusterId, (error, zoom) => {
          if (error) return;
          map.easeTo({
            center: feature.geometry.coordinates,
            zoom
          });
        });
      });

      map.on("click", "place-points", event => {
        const feature = event.features && event.features[0];
        if (feature) showPlacePopup(Number(feature.properties.id));
      });

      map.on("mouseenter", "place-clusters", () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", "place-clusters", () => {
        map.getCanvas().style.cursor = "";
      });
      map.on("mouseenter", "place-points", () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", "place-points", () => {
        map.getCanvas().style.cursor = "";
      });

      updatePlaces();
    }

    document.getElementById("searchInput").addEventListener("input", () => {
      if (!document.getElementById("searchInput").value.trim()) {
        activeQuery = "";
        const results = updatePlaces();
        if (activeCategory === "전체") {
          resetMapView();
        } else if (results.length > 0) {
          const bounds = new maplibregl.LngLatBounds();
          results.forEach(place => bounds.extend([place.lng, place.lat]));
          map.fitBounds(bounds, { padding: 80, maxZoom: 16 });
        } else {
          resetMapView();
        }
      }
    });

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach(item => {
          item.classList.toggle("active", item === button);
        });

        activeCategory = button.dataset.category;

        if (activeCategory === "전체") {
          document.getElementById("searchInput").value = "";
          activeQuery = "";
          updatePlaces();
          resetMapView();
        } else {
          const results = updatePlaces();
          if (results.length > 0) {
            const bounds = new maplibregl.LngLatBounds();
            results.forEach(place => bounds.extend([place.lng, place.lat]));
            map.fitBounds(bounds, { padding: 80, maxZoom: 16 });
          }
        }
      });
    });    document.getElementById("searchForm").addEventListener("submit", event => {
      event.preventDefault();
      applySearch();
    });

    document.getElementById("searchInput").addEventListener("input", () => {
      if (!document.getElementById("searchInput").value.trim()) {
        activeQuery = "";
        const results = renderPlaces();
        if (activeCategory === "전체") {
          resetMapView();
        } else if (results.length > 0) {
          const bounds = new maplibregl.LngLatBounds();
          results.forEach(place => bounds.extend([place.lng, place.lat]));
          map.fitBounds(bounds, { padding: 80, maxZoom: 16 });
        } else {
          resetMapView();
        }
      }
    });

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach(item => {
          item.classList.toggle("active", item === button);
        });

        activeCategory = button.dataset.category;

        if (activeCategory === "전체") {
          document.getElementById("searchInput").value = "";
          activeQuery = "";
          renderPlaces();
          resetMapView();
        } else {
          const results = renderPlaces();
          if (results.length > 0) {
            const bounds = new maplibregl.LngLatBounds();
            results.forEach(place => bounds.extend([place.lng, place.lat]));
            map.fitBounds(bounds, { padding: 80, maxZoom: 16 });
          }
        }
      });
    });

    map.on("load", () => {
      installPlaceLayers();
    });</script>

<script>
(() => {
  const search = document.getElementById("academy-search");
  const results = document.getElementById("academy-results");
  const count = document.getElementById("academy-count");
  const detail = document.getElementById("academy-detail");
  let academies = [];

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }
  function listText(a, key) {
    const v = a[key];
    return Array.isArray(v) ? v.join(", ") : "";
  }
  function won(n) {
    return Number(n).toLocaleString("ko-KR") + " won";
  }
  function render() {
    const q = search.value.trim().toLocaleLowerCase();
    const filtered = academies.filter(a => [
      a.name, a.address, a.type,
      listText(a, "subjects"), listText(a, "courses")
    ].join(" ").toLocaleLowerCase().includes(q));

    count.textContent = filtered.length.toLocaleString() +
      " results / " + academies.length.toLocaleString() + " academies";

    results.innerHTML = filtered.slice(0, 150).map((a, i) => `
      <button class="academy-row" type="button" data-index="${academies.indexOf(a)}">
        <strong>${esc(a.name)}</strong>
        <small>${esc(a.type)} ? ${esc(a.address)}</small>
      </button>`).join("");

    if (!filtered.length) {
      results.innerHTML = '<p style="padding:12px 16px">No matching academies.</p>';
    } else if (filtered.length > 150) {
      results.insertAdjacentHTML("beforeend",
        '<p style="padding:8px 16px;color:#697586">Showing first 150 results. Refine your search.</p>');
    }
  }

  results.addEventListener("click", event => {
    const button = event.target.closest("button[data-index]");
    if (!button) return;
    const a = academies[Number(button.dataset.index)];
    if (!a) return;

    const academyMap = window.academyMap;
    const lng = Number(a.longitude);
    const lat = Number(a.latitude);

    if (academyMap && Number.isFinite(lng) && Number.isFinite(lat)) {
      academyMap.flyTo({
        center: [lng, lat],
        zoom: 17,
        essential: true
      });
    }

    const subjects = listText(a, "subjects");
    const courses = listText(a, "courses");
    const fees = Array.isArray(a.fees) ? a.fees : [];
    const status = Array.isArray(a.status) ? a.status : [];

    detail.style.display = "block";
    detail.innerHTML = `
      <button id="academy-close" type="button">Close</button>
      <h3>${esc(a.name)}</h3>
      <p><b>Type:</b> ${esc(a.type)}</p>
      <p><b>Address:</b> ${esc(a.address)}</p>
      <p><b>Subjects:</b> ${esc(subjects || "Not provided")}</p>
      <p><b>Courses:</b> ${esc(courses || "Not provided")}</p>
      <p><b>Fees:</b> ${fees.length ? esc(fees.map(won).join(", ")) : "Not provided"}</p>
      <p><b>Status:</b> ${esc(status.join(", ") || "Not provided")}</p>
      <p><b>Rating:</b> No reviews yet</p>
      <p><b>Reviews:</b> 0</p>
      <p class="muted">Coordinates: ${Number.isFinite(Number(a.longitude)) && Number.isFinite(Number(a.latitude)) ? "Available" : "Unavailable"}</p>`;
    document.getElementById("academy-close").addEventListener("click", () => {
      detail.style.display = "none";
    });
  });

  search.addEventListener("input", render);

  fetch("./data/jeonju-academies-geocoded.json")
    .then(response => {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(data => {
      academies = data;
      render();
    })
    .catch(error => {
      count.textContent = "Could not load academy data";
      results.innerHTML =
        '<p style="padding:12px 16px">Start the local web server in the project folder, then reopen this page. Error: ' +
        esc(error.message) + '</p>';
    });
})();
</script>
